<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backlog Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="manifest" id="dynamic-manifest">
    <style>
        :root {
            --bg-color: #0d0d16;
            --card-bg: #161625;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-purple: #8a2be2;
            --text-main: #e2e8f0;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.05);
            --input-bg: rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --neon-cyan: #0ea5e9;
            --neon-magenta: #d946ef;
            --neon-purple: #8b5cf6;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(0, 0, 0, 0.05);
        }

        [data-theme="light"] .game-card:hover {
            background-color: #1f2937 !important;
        }
        
        [data-theme="light"] .game-card:hover h3 {
            color: #d1d5db !important;
        }

        [data-theme="light"] h1, 
        [data-theme="light"] .category-column h2 {
            color: #ffffff !important;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2), 0 0 10px rgba(0,0,0,0.1) !important;
        }
        
        [data-theme="light"] .neon-text-magenta {
            text-shadow: 0 0 5px #fff, 0 0 10px var(--neon-magenta), 0 0 20px var(--neon-magenta) !important;
        }

        [data-theme="cyberpunk"] {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --neon-cyan: #fcee0a;
            --neon-magenta: #00f0ff;
            --neon-purple: #ff003c;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --input-bg: #0d1117;
        }

        [data-theme="dracula"] {
            --bg-color: #282a36;
            --card-bg: #44475a;
            --neon-cyan: #8be9fd;
            --neon-magenta: #ff79c6;
            --neon-purple: #bd93f9;
            --text-main: #f8f8f2;
            --text-muted: #6272a4;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: #282a36;
        }

        :root {
            --neon-text-color: #ffffff;
            --neon-glow-inner: #ffffff;
            --neon-glow-cyan: var(--neon-cyan);
            --neon-glow-magenta: var(--neon-magenta);
            
            --bg-primary: var(--bg-color);
            --bg-secondary: var(--card-bg);
            --aurora-1: rgba(0, 243, 255, 0.08);
            --aurora-2: rgba(255, 0, 255, 0.08);
            --aurora-3: transparent;
        }

        [data-theme="light"] {
            --neon-text-color: #111827;
            --neon-glow-inner: transparent;
            --neon-glow-cyan: rgba(14, 165, 233, 0.3);
            --neon-glow-magenta: rgba(217, 70, 239, 0.3);
        }
        
        [data-bg-color="dark"] { --bg-primary: #0a0a10; --bg-secondary: #1a1a2e; }
        [data-bg-color="blue"] { --bg-primary: #020617; --bg-secondary: #1e3a8a; }
        [data-bg-color="purple"] { --bg-primary: #170b21; --bg-secondary: #4a1d63; }
        [data-bg-color="crimson"] { --bg-primary: #1a0505; --bg-secondary: #5c0f1c; }

        [data-aurora-color="nebula"] { 
            --bg-primary: #0a0514; 
            --aurora-1: rgba(138, 43, 226, 0.2); 
            --aurora-2: rgba(255, 0, 255, 0.15); 
            --aurora-3: rgba(0, 243, 255, 0.15); 
        }
        [data-aurora-color="borealis"] { 
            --bg-primary: #020617; 
            --aurora-1: rgba(0, 255, 128, 0.15); 
            --aurora-2: rgba(0, 243, 255, 0.15); 
            --aurora-3: rgba(138, 43, 226, 0.1); 
        }
        [data-aurora-color="sunset"] { 
            --bg-primary: #1a0b16; 
            --aurora-1: rgba(255, 0, 128, 0.15); 
            --aurora-2: rgba(255, 165, 0, 0.15); 
            --aurora-3: rgba(255, 0, 0, 0.1); 
        }
        [data-aurora-color="cyber"] { 
            --bg-primary: #0d1117; 
            --aurora-1: rgba(252, 238, 10, 0.15); 
            --aurora-2: rgba(255, 0, 60, 0.15); 
            --aurora-3: rgba(0, 240, 255, 0.1); 
        }

        .bg-\[\#161625\] { background-color: var(--card-bg) !important; }
        .border-\[rgba\(255\,255\,255\,0\.05\)\] { border-color: var(--border-color) !important; }
        .text-white { color: var(--text-main) !important; }
        .text-gray-400, .text-gray-500 { color: var(--text-muted) !important; }
        .bg-black\/30, .bg-black\/40, .bg-black\/50 { background-color: var(--input-bg) !important; }
        .bg-gray-800 { background-color: var(--border-color) !important; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease, background-image 0.3s ease;
        }

        body[data-bg="grid"] {
            background-color: var(--bg-primary);
            background-image: linear-gradient(0deg, transparent 24%, rgba(138, 43, 226, 0.05) 25%, rgba(138, 43, 226, 0.05) 26%, transparent 27%, transparent 74%, rgba(138, 43, 226, 0.05) 75%, rgba(138, 43, 226, 0.05) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(138, 43, 226, 0.05) 25%, rgba(138, 43, 226, 0.05) 26%, transparent 27%, transparent 74%, rgba(138, 43, 226, 0.05) 75%, rgba(138, 43, 226, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
        }
        body[data-bg="solid"] {
            background-image: none;
            background-color: var(--bg-primary);
        }
        body[data-bg="gradient"] {
            background-image: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            background-attachment: fixed;
        }
        body[data-bg="aurora"] {
            background-color: var(--bg-primary);
            background-image: radial-gradient(circle at 15% 10%, var(--aurora-1) 0%, transparent 40%),
                              radial-gradient(circle at 85% 90%, var(--aurora-2) 0%, transparent 40%),
                              radial-gradient(circle at 50% 50%, var(--aurora-3) 0%, transparent 60%);
            background-attachment: fixed;
        }

        .neon-text-cyan {
            color: var(--neon-text-color);
            text-shadow: 0 0 5px var(--neon-glow-inner), 0 0 10px var(--neon-glow-inner), 0 0 20px var(--neon-glow-cyan), 0 0 40px var(--neon-glow-cyan);
        }
        
        .neon-text-magenta {
            color: var(--neon-text-color);
            text-shadow: 0 0 5px var(--neon-glow-inner), 0 0 10px var(--neon-glow-inner), 0 0 20px var(--neon-glow-magenta), 0 0 40px var(--neon-glow-magenta);
        }

        .settings-float-btn {
            background-color: var(--card-bg) !important;
            border: 1px solid var(--text-muted) !important;
            color: var(--text-muted) !important;
        }
        .settings-float-btn:hover {
            border-color: var(--neon-cyan) !important;
            color: var(--neon-cyan) !important;
        }

        .active-theme-btn {
            border-color: var(--neon-cyan) !important;
            background-color: var(--border-color) !important;
        }
        
        .active-ring-btn {
            box-shadow: 0 0 0 2px var(--card-bg), 0 0 0 4px var(--neon-cyan) !important;
            transform: scale(1.05);
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 4px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-results {
            max-height: 300px;
            overflow-y: auto;
            background: var(--card-bg);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        select, textarea, input[type="number"] {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
        }
        select option { background-color: var(--card-bg); color: var(--text-main); }
        
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid var(--neon-cyan);
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col" data-bg="grid">

    <button onclick="openSettingsModal()" class="fixed top-4 right-4 md:top-8 md:right-8 transition-colors z-[60] w-10 h-10 rounded-full flex justify-center items-center backdrop-blur-sm settings-float-btn" title="Visuella Inställningar">
        <i class="fas fa-palette"></i>
    </button>

    <header class="mb-8 w-full max-w-7xl mx-auto">
        <h1 class="text-4xl md:text-5xl font-bold mb-6 text-center text-white neon-text-magenta tracking-wider">BACKLOG TRACKER</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-[#161625] p-6 rounded-xl border border-[rgba(255,255,255,0.05)] shadow-lg text-center flex flex-col justify-center items-center relative overflow-hidden group">
                <i class="fas fa-gamepad text-3xl mb-2 text-[#00f3ff]"></i>
                <p class="text-sm text-gray-400 uppercase tracking-widest">Ospelade (Backlogg)</p>
                <p class="text-3xl font-bold text-white neon-text-cyan" id="stat-backlog">0</p>
            </div>
            <div class="bg-[#161625] p-6 rounded-xl border border-[rgba(255,255,255,0.05)] shadow-lg text-center flex flex-col justify-center items-center">
                <i class="fas fa-clock text-3xl mb-2 text-[#ff00ff]"></i>
                <p class="text-sm text-gray-400 uppercase tracking-widest">Estimerad Tid Kvar</p>
                <p class="text-3xl font-bold text-white neon-text-magenta"><span id="stat-time">0</span>h</p>
            </div>
            <div class="bg-[#161625] p-6 rounded-xl border border-[rgba(255,255,255,0.05)] shadow-lg text-center flex flex-col justify-center items-center">
                <i class="fas fa-trophy text-3xl mb-2 text-[#8a2be2]"></i>
                <p class="text-sm text-gray-400 uppercase tracking-widest">Avklarandegrad</p>
                <p class="text-3xl font-bold text-white" style="text-shadow: 0 0 10px #8a2be2;"><span id="stat-completion">0</span>%</p>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 items-center justify-between bg-[#161625] p-4 rounded-xl border border-[rgba(255,255,255,0.05)] relative z-50">
            <div class="relative w-full md:w-1/2">
                <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Sök spel..." class="w-full bg-black/30 border border-gray-700 text-white rounded-lg py-3 pl-12 pr-4 focus:outline-none focus:border-[#00f3ff] focus:ring-1 focus:ring-[#00f3ff] transition-all">
                <div id="search-results" class="search-results absolute w-full mt-2 rounded-lg hidden z-50"></div>
            </div>
            <div class="w-full md:w-auto flex gap-2">
                <select id="sort-select" class="w-full md:w-auto rounded-lg py-3 px-4 focus:outline-none focus:border-[#ff00ff]">
                    <option value="none">Sortera efter...</option>
                    <option value="timeAsc">Kortast speltid</option>
                    <option value="platform">Plattform</option>
                    <option value="yearDesc">Nyast (Lanseringsår)</option>
                </select>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-7xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6" id="board">
            
            <div class="category-column flex flex-col gap-4">
                <h2 class="text-xl font-bold text-white border-b-2 border-[#00f3ff] pb-2 uppercase tracking-wider flex justify-between">
                    Backlogg <span class="bg-[#00f3ff] text-black text-xs px-2 py-1 rounded-full" id="count-backlog">0</span>
                </h2>
                <div id="col-backlog" class="flex flex-col gap-4 min-h-[200px]"></div>
            </div>

            <div class="category-column flex flex-col gap-4">
                <h2 class="text-xl font-bold text-white border-b-2 border-[#ff00ff] pb-2 uppercase tracking-wider flex justify-between">
                    Spelar Nu <span class="bg-[#ff00ff] text-white text-xs px-2 py-1 rounded-full" id="count-playing">0</span>
                </h2>
                <div id="col-playing" class="flex flex-col gap-4 min-h-[200px]"></div>
            </div>

            <div class="category-column flex flex-col gap-4">
                <h2 class="text-xl font-bold text-white border-b-2 border-green-400 pb-2 uppercase tracking-wider flex justify-between">
                    Klarat <span class="bg-green-400 text-black text-xs px-2 py-1 rounded-full" id="count-completed">0</span>
                </h2>
                <div id="col-completed" class="flex flex-col gap-4 min-h-[200px]"></div>
            </div>

        </div>
    </main>

    <!-- Modal Container -->
    <div id="game-modal" class="fixed inset-0 bg-black/80 hidden z-[100] flex justify-center items-center backdrop-blur-sm" onclick="if(event.target === this) closeModal()">
        <div class="bg-[#161625] border border-[#00f3ff]/30 rounded-xl max-w-lg w-full m-4 p-6 relative shadow-[0_0_30px_rgba(0,243,255,0.15)] overflow-hidden overflow-y-auto max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors z-10 bg-black/50 w-8 h-8 rounded-full flex justify-center items-center backdrop-blur-sm"><i class="fas fa-times"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/80 hidden z-[110] flex justify-center items-center backdrop-blur-sm" onclick="if(event.target === this) closeSettingsModal()">
        <div class="bg-[#161625] border border-[#00f3ff]/30 rounded-xl max-w-md w-full m-4 p-6 relative shadow-[0_0_30px_rgba(0,243,255,0.15)] overflow-hidden">
            <button onclick="closeSettingsModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors z-10 bg-black/50 w-8 h-8 rounded-full flex justify-center items-center backdrop-blur-sm"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-bold text-white mb-6 neon-text-cyan">Visuella Inställningar</h2>
            
            <div class="space-y-6">
                <div>
                    <h3 class="text-sm font-bold text-gray-400 mb-3 uppercase tracking-wider">Färgtema (Kort/Text)</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button data-theme-val="synthwave" onclick="changeTheme('synthwave')" class="theme-btn p-3 rounded-lg border border-[rgba(255,255,255,0.05)] bg-black/30 hover:border-[#00f3ff] text-left transition-colors flex items-center gap-2 text-white text-sm">
                            <div class="w-4 h-4 rounded-full bg-[#0d0d16] border border-[#00f3ff]"></div> Synthwave
                        </button>
                        <button data-theme-val="light" onclick="changeTheme('light')" class="theme-btn p-3 rounded-lg border border-[rgba(255,255,255,0.05)] bg-black/30 hover:border-[#00f3ff] text-left transition-colors flex items-center gap-2 text-white text-sm">
                            <div class="w-4 h-4 rounded-full bg-[#e5e7eb] border-2 border-[#0ea5e9]"></div> Ljust
                        </button>
                        <button data-theme-val="cyberpunk" onclick="changeTheme('cyberpunk')" class="theme-btn p-3 rounded-lg border border-[rgba(255,255,255,0.05)] bg-black/30 hover:border-[#00f3ff] text-left transition-colors flex items-center gap-2 text-white text-sm">
                            <div class="w-4 h-4 rounded-full bg-[#0d1117] border border-[#fcee0a]"></div> Cyberpunk
                        </button>
                        <button data-theme-val="dracula" onclick="changeTheme('dracula')" class="theme-btn p-3 rounded-lg border border-[rgba(255,255,255,0.05)] bg-black/30 hover:border-[#00f3ff] text-left transition-colors flex items-center gap-2 text-white text-sm">
                            <div class="w-4 h-4 rounded-full bg-[#282a36] border border-[#ff79c6]"></div> Dracula
                        </button>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-bold text-gray-400 mb-3 uppercase tracking-wider">Bakgrundsstil</h3>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button data-bg-val="grid" onclick="changeBg('grid')" class="bg-btn p-3 rounded-lg border border-[rgba(255,255,255,0.05)] bg-black/30 hover:border-[#ff00ff] text-left transition-colors text-white text-sm">Rutnät (Grid)</button>
                        <button data-bg-val="solid" onclick="changeBg('solid')" class="bg-btn p-3 rounded-lg border border-[rgba(255,255,255,0.05)] bg-black/30 hover:border-[#ff00ff] text-left transition-colors text-white text-sm">Enfärgad</button>
                        <button data-bg-val="gradient" onclick="changeBg('gradient')" class="bg-btn p-3 rounded-lg border border-[rgba(255,255,255,0.05)] bg-black/30 hover:border-[#ff00ff] text-left transition-colors text-white text-sm">Mjuk Toning</button>
                        <button data-bg-val="aurora" onclick="changeBg('aurora')" class="bg-btn p-3 rounded-lg border border-[rgba(255,255,255,0.05)] bg-black/30 hover:border-[#ff00ff] text-left transition-colors text-white text-sm">Aurora Glow</button>
                    </div>

                    <div id="bg-color-options" class="animate-[fadeIn_0.3s_ease-out]">
                        <h4 class="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider flex items-center gap-2"><i class="fas fa-caret-down"></i> Välj Bakgrundsnyans</h4>
                        
                        <div id="standard-colors-container" class="grid grid-cols-4 gap-2">
                            <button data-bgcolor-val="dark" onclick="changeBgColor('dark')" class="bg-color-btn h-10 rounded-lg bg-gradient-to-br from-[#0a0a10] to-[#1a1a2e] border border-gray-600 hover:border-white transition-all" title="Mörk"></button>
                            <button data-bgcolor-val="blue" onclick="changeBgColor('blue')" class="bg-color-btn h-10 rounded-lg bg-gradient-to-br from-[#020617] to-[#1e3a8a] border border-gray-600 hover:border-white transition-all" title="Midnatt"></button>
                            <button data-bgcolor-val="purple" onclick="changeBgColor('purple')" class="bg-color-btn h-10 rounded-lg bg-gradient-to-br from-[#170b21] to-[#4a1d63] border border-gray-600 hover:border-white transition-all" title="Neonlila"></button>
                            <button data-bgcolor-val="crimson" onclick="changeBgColor('crimson')" class="bg-color-btn h-10 rounded-lg bg-gradient-to-br from-[#1a0505] to-[#5c0f1c] border border-gray-600 hover:border-white transition-all" title="Karmosin"></button>
                        </div>

                        <div id="aurora-colors-container" class="grid grid-cols-4 gap-2 hidden">
                            <button data-auroracolor-val="nebula" onclick="changeAuroraColor('nebula')" class="aurora-color-btn h-10 rounded-lg bg-gradient-to-br from-[#8a2be2] via-[#ff00ff] to-[#00f3ff] border border-gray-600 hover:border-white transition-all" title="Nebula"></button>
                            <button data-auroracolor-val="borealis" onclick="changeAuroraColor('borealis')" class="aurora-color-btn h-10 rounded-lg bg-gradient-to-br from-[#00ff80] via-[#00f3ff] to-[#8a2be2] border border-gray-600 hover:border-white transition-all" title="Borealis"></button>
                            <button data-auroracolor-val="sunset" onclick="changeAuroraColor('sunset')" class="aurora-color-btn h-10 rounded-lg bg-gradient-to-br from-[#ff0080] via-[#ffa500] to-[#ff0000] border border-gray-600 hover:border-white transition-all" title="Sunset"></button>
                            <button data-auroracolor-val="cyber" onclick="changeAuroraColor('cyber')" class="aurora-color-btn h-10 rounded-lg bg-gradient-to-br from-[#fcee0a] via-[#ff003c] to-[#00f0ff] border border-gray-600 hover:border-white transition-all" title="Cyber"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-12 text-center text-gray-500 text-sm pb-4">
        &copy; 2026 Backlog tracker.
    </footer>

    <script>
        let savedTheme = localStorage.getItem('neon_theme') || 'synthwave';
        let savedBg = localStorage.getItem('neon_bg') || 'grid';
        let savedBgColor = localStorage.getItem('neon_bg_color') || 'dark';
        let savedAuroraColor = localStorage.getItem('neon_aurora_color') || 'nebula';
        
        function initVisuals() {
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.body.setAttribute('data-bg', savedBg);
            document.body.setAttribute('data-bg-color', savedBgColor);
            document.body.setAttribute('data-aurora-color', savedAuroraColor);
            updateActiveButtons();
            toggleBgColorOptions();
        }

        function updateActiveButtons() {
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.dataset.themeVal === savedTheme) {
                    btn.classList.add('active-theme-btn');
                    btn.classList.remove('border-[rgba(255,255,255,0.05)]', 'bg-black/30');
                } else {
                    btn.classList.remove('active-theme-btn');
                    btn.classList.add('border-[rgba(255,255,255,0.05)]', 'bg-black/30');
                }
            });

            document.querySelectorAll('.bg-btn').forEach(btn => {
                if (btn.dataset.bgVal === savedBg) {
                    btn.classList.add('active-theme-btn');
                    btn.classList.remove('border-[rgba(255,255,255,0.05)]', 'bg-black/30');
                } else {
                    btn.classList.remove('active-theme-btn');
                    btn.classList.add('border-[rgba(255,255,255,0.05)]', 'bg-black/30');
                }
            });

            document.querySelectorAll('.bg-color-btn').forEach(btn => {
                if (btn.dataset.bgcolorVal === savedBgColor) {
                    btn.classList.add('active-ring-btn');
                } else {
                    btn.classList.remove('active-ring-btn');
                }
            });

            document.querySelectorAll('.aurora-color-btn').forEach(btn => {
                if (btn.dataset.auroracolorVal === savedAuroraColor) {
                    btn.classList.add('active-ring-btn');
                } else {
                    btn.classList.remove('active-ring-btn');
                }
            });
        }

        function toggleBgColorOptions() {
            const stdContainer = document.getElementById('standard-colors-container');
            const aurContainer = document.getElementById('aurora-colors-container');
            
            if (savedBg === 'aurora') {
                stdContainer.classList.add('hidden');
                aurContainer.classList.remove('hidden');
            } else {
                stdContainer.classList.remove('hidden');
                aurContainer.classList.add('hidden');
            }
        }

        function openSettingsModal() {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            updateActiveButtons();
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function changeTheme(theme) {
            savedTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('neon_theme', theme);
            updateActiveButtons();
        }

        function changeBg(bg) {
            savedBg = bg;
            document.body.setAttribute('data-bg', bg);
            localStorage.setItem('neon_bg', bg);
            toggleBgColorOptions();
            updateActiveButtons();
        }

        function changeBgColor(color) {
            savedBgColor = color;
            document.body.setAttribute('data-bg-color', color);
            localStorage.setItem('neon_bg_color', color);
            updateActiveButtons();
        }

        function changeAuroraColor(color) {
            savedAuroraColor = color;
            document.body.setAttribute('data-aurora-color', color);
            localStorage.setItem('neon_aurora_color', color);
            updateActiveButtons();
        }
        
        initVisuals();

        const manifestData = {
            "name": "Neon Game Tracker",
            "short_name": "RetroLog",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0d0d16",
            "theme_color": "#00f3ff",
            "icons": [{
                "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230d0d16'/%3E%3Ctext x='50' y='65' font-size='60' text-anchor='middle' fill='%2300f3ff'%3E%26%23127918;%3C/text%3E%3C/svg%3E",
                "sizes": "192x192",
                "type": "image/svg+xml"
            }]
        };
        const manifestString = JSON.stringify(manifestData);
        document.getElementById('dynamic-manifest').setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(manifestString));

        let games = JSON.parse(localStorage.getItem('neon_games')) || [];
        // Se till att alla spel har anteckningsfält
        games = games.map(g => ({ ...g, progress: g.progress || 0, notes: g.notes || "" }));
        let currentSort = 'none';

        const saveGames = () => {
            localStorage.setItem('neon_games', JSON.stringify(games));
            renderBoard();
        };

        const RAWG_API_KEY = 'a9b2d63374a4490d8a925c69e5622e2a';
        
        async function fetchFromRAWG(query) {
            try {
                const response = await fetch(`https://api.rawg.io/api/games?search=${query}&key=${RAWG_API_KEY}&page_size=8`);
                const data = await response.json();
                
                return data.results.map(g => {
                    let plat = "Annan";
                    if (g.platforms) {
                        const slugs = g.platforms.map(p => p.platform.slug);
                        if (slugs.includes('playstation5')) plat = 'PS5';
                        else if (slugs.includes('nintendo-switch')) plat = 'Switch';
                        else plat = g.platforms[0].platform.name;
                    }
                    
                    const defaultImg = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iI2ZmZiIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+TmlsPC90ZXh0Pjwvc3ZnPg==";

                    return {
                        id: g.id,
                        title: g.name,
                        image: g.background_image || defaultImg,
                        playtime: g.playtime > 0 ? g.playtime : 15,
                        platform: plat,
                        year: g.released ? parseInt(g.released.split('-')[0]) : "Okänt"
                    };
                });
            } catch (error) {
                console.error("RAWG API Error:", error);
                return [];
            }
        }

        const searchInput = document.getElementById('search-input');
        const searchResultsDiv = document.getElementById('search-results');
        const sortSelect = document.getElementById('sort-select');

        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            clearTimeout(searchTimeout);
            
            if (query.length < 2) {
                searchResultsDiv.classList.add('hidden');
                return;
            }

            searchResultsDiv.innerHTML = '<div class="p-4 flex justify-center"><div class="loading-spinner"></div></div>';
            searchResultsDiv.classList.remove('hidden');

            searchTimeout = setTimeout(async () => {
                const results = await fetchFromRAWG(query); 
                renderSearchResults(results);
            }, 500);
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResultsDiv.contains(e.target)) {
                searchResultsDiv.classList.add('hidden');
            }
        });

        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderBoard();
        });

        function renderSearchResults(results) {
            searchResultsDiv.innerHTML = '';
            if (results.length === 0) {
                searchResultsDiv.innerHTML = '<div class="p-4 text-gray-400">Inga spel hittades...</div>';
            } else {
                results.forEach(game => {
                    const div = document.createElement('div');
                    div.className = 'p-3 border-b border-gray-700 hover:bg-[#ff00ff20] cursor-pointer flex items-center gap-3 transition-colors';
                    div.innerHTML = `
                        <img src="${game.image}" alt="${game.title}" class="w-12 h-16 object-cover rounded shadow" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iI2ZmZiIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+TmlsPC90ZXh0Pjwvc3ZnPg=='">
                        <div>
                            <p class="font-bold text-white">${game.title}</p>
                            <p class="text-xs text-gray-400">${game.platform} | ${game.year} | ~${game.playtime}h</p>
                        </div>
                    `;
                    div.onclick = () => addGame(game);
                    searchResultsDiv.appendChild(div);
                });
            }
        }

        function addGame(gameData) {
            if (games.some(g => g.id === gameData.id)) {
                alert("Spelet finns redan i din lista!");
                return;
            }

            const newGame = {
                ...gameData,
                uid: Date.now().toString(),
                status: 'backlog',
                progress: 0,
                notes: ""
            };

            games.push(newGame);
            saveGames();
            
            searchInput.value = '';
            searchResultsDiv.classList.add('hidden');
        }

        function updateGameStatus(uid, newStatus) {
            const index = games.findIndex(g => g.uid === uid);
            if (index !== -1) {
                games[index].status = newStatus;
                saveGames();
            }
        }

        function deleteGame(uid) {
            games = games.filter(g => g.uid !== uid);
            saveGames();
        }

        function openModal(uid) {
            const game = games.find(g => g.uid === uid);
            if (!game) return;

            const modal = document.getElementById('game-modal');
            const modalContent = document.getElementById('modal-content');

            modalContent.innerHTML = `
                <img src="${game.image}" class="w-full h-48 md:h-64 object-cover rounded-lg mb-4 shadow-lg border border-gray-700" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iI2ZmZiIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+TmlsPC90ZXh0Pjwvc3ZnPg=='">
                <h2 class="text-2xl font-bold text-white mb-2 neon-text-cyan pr-8">${game.title}</h2>
                <div class="flex flex-wrap gap-2 text-xs md:text-sm text-gray-400 mb-6">
                    <span class="bg-black/50 px-2 py-1 rounded border border-gray-700"><i class="fas fa-gamepad"></i> ${game.platform}</span>
                    <span class="bg-black/50 px-2 py-1 rounded border border-gray-700"><i class="fas fa-calendar"></i> ${game.year}</span>
                    <div class="flex items-center bg-black/50 px-2 py-1 rounded border border-[#00f3ff]/40 group" title="Klicka för att ändra tid">
                         <i class="fas fa-clock mr-2 text-[#00f3ff]"></i>
                         <input type="number" value="${game.playtime}" class="w-12 bg-transparent border-none p-0 focus:ring-0 text-white font-bold" onchange="updatePlaytime('${game.uid}', this.value)">
                         <span class="ml-1 text-xs">h totalt</span>
                    </div>
                </div>

                <div class="mb-6 bg-black/30 p-4 rounded-lg border border-[rgba(255,255,255,0.05)]">
                    <label class="block text-sm font-bold text-gray-300 mb-3 flex justify-between">
                        <span>Din progression</span>
                        <span class="text-[#00f3ff]">${game.progress}%</span>
                    </label>
                    <input type="range" min="0" max="100" value="${game.progress}"
                           class="w-full accent-[#00f3ff] cursor-pointer"
                           oninput="this.previousElementSibling.children[1].innerText = this.value + '%'"
                           onchange="updateProgress('${game.uid}', this.value)">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-300 mb-2 uppercase tracking-widest text-xs"><i class="fas fa-sticky-note text-[#ff00ff] mr-2"></i>Egna Anteckningar</label>
                    <textarea class="w-full h-32 p-3 rounded-lg text-sm focus:outline-none focus:border-[#ff00ff] transition-all resize-none" placeholder="Skriv strategier, tankar eller minnen här..." oninput="updateNotes('${game.uid}', this.value)">${game.notes || ""}</textarea>
                </div>

                <div class="flex gap-4 items-end">
                    <div class="flex-grow">
                        <label class="block text-xs text-gray-500 mb-1">Ändra status</label>
                        <select onchange="updateGameStatus('${game.uid}', this.value); openModal('${game.uid}')" class="w-full p-2 rounded bg-black/50 border border-gray-600 text-white focus:border-[#ff00ff] focus:outline-none focus:ring-1 focus:ring-[#ff00ff]">
                             <option value="backlog" ${game.status === 'backlog' ? 'selected' : ''}>Backlogg</option>
                             <option value="playing" ${game.status === 'playing' ? 'selected' : ''}>Spelar Nu</option>
                             <option value="completed" ${game.status === 'completed' ? 'selected' : ''}>Klarat</option>
                        </select>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            document.getElementById('game-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function updateProgress(uid, value) {
            const game = games.find(g => g.uid === uid);
            if (game) {
                game.progress = parseInt(value);
                saveGames();
            }
        }

        function updateNotes(uid, text) {
            const game = games.find(g => g.uid === uid);
            if (game) {
                game.notes = text;
                localStorage.setItem('neon_games', JSON.stringify(games));
                // Vi kör inte saveGames() här för att undvika att renderBoard() stänger tangentbordet/modalen medan man skriver
            }
        }

        function updatePlaytime(uid, hours) {
            const game = games.find(g => g.uid === uid);
            if (game) {
                game.playtime = parseFloat(hours) || 0;
                saveGames();
            }
        }

        function getSortedGames() {
            let sorted = [...games];
            if (currentSort === 'timeAsc') {
                sorted.sort((a, b) => a.playtime - b.playtime);
            } else if (currentSort === 'platform') {
                sorted.sort((a, b) => a.platform.localeCompare(b.platform));
            } else if (currentSort === 'yearDesc') {
                sorted.sort((a, b) => {
                    const yearA = a.year === "Okänt" ? 0 : a.year;
                    const yearB = b.year === "Okänt" ? 0 : b.year;
                    return yearB - yearA;
                });
            }
            return sorted;
        }

        function renderBoard() {
            const cols = {
                'backlog': document.getElementById('col-backlog'),
                'playing': document.getElementById('col-playing'),
                'completed': document.getElementById('col-completed')
            };

            Object.values(cols).forEach(col => col.innerHTML = '');

            const sortedGames = getSortedGames();
            let counts = { backlog: 0, playing: 0, completed: 0 };
            let totalRemainingTime = 0;

            sortedGames.forEach(game => {
                counts[game.status]++;
                
                if (game.status !== 'completed') {
                    totalRemainingTime += game.playtime * (1 - (game.progress / 100));
                }

                const card = document.createElement('div');
                card.className = 'game-card flex flex-row items-stretch hover:bg-white/5 transition-colors rounded-lg overflow-hidden group';
                
                let platColor = 'text-gray-400';
                if (game.platform.includes('PS5') || game.platform.includes('PlayStation')) platColor = 'text-blue-400';
                if (game.platform.includes('Switch') || game.platform.includes('Nintendo')) platColor = 'text-red-500';
                if (game.platform.includes('PC')) platColor = 'text-yellow-400';

                card.innerHTML = `
                    <div class="flex items-center gap-3 p-2 cursor-pointer w-full" onclick="openModal('${game.uid}')" title="Klicka för detaljer">
                        <img src="${game.image}" alt="${game.title}" class="w-12 h-16 object-cover rounded shadow border border-gray-700/50 group-hover:border-[#00f3ff]/50 transition-colors" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iI2ZmZiIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+TmlsPC90ZXh0Pjwvc3ZnPg=='">
                        <div class="flex-grow min-w-0 pr-2">
                            <h3 class="font-bold text-sm leading-tight truncate mb-1" style="color: var(--text-main);">${game.title}</h3>
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] font-bold ${platColor} bg-black/40 px-1.5 py-0.5 rounded uppercase tracking-wider">${game.platform}</span>
                                <span class="text-[10px]" style="color: var(--text-muted);">${game.progress}%</span>
                            </div>
                            <div class="w-full bg-gray-800 rounded-full h-1 mt-1">
                                <div class="bg-gradient-to-r from-[#00f3ff] to-[#ff00ff] h-1 rounded-full transition-all duration-500" style="width: ${game.progress}%"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex flex-col border-l border-[rgba(255,255,255,0.05)] w-10 flex-shrink-0 bg-black/20">
                        <div class="h-1/2 relative flex items-center justify-center hover:bg-white/10 transition-colors border-b border-[rgba(255,255,255,0.05)]" title="Byt status">
                            <select onchange="updateGameStatus('${game.uid}', this.value)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                                <option value="backlog" ${game.status === 'backlog' ? 'selected' : ''}>Backlogg</option>
                                <option value="playing" ${game.status === 'playing' ? 'selected' : ''}>Spelar Nu</option>
                                <option value="completed" ${game.status === 'completed' ? 'selected' : ''}>Klarat</option>
                            </select>
                            <i class="fas fa-exchange-alt text-xs text-gray-400"></i>
                        </div>
                        <button onclick="deleteGame('${game.uid}')" class="h-1/2 flex items-center justify-center text-red-500/50 hover:text-red-400 hover:bg-red-500/20 transition-colors" title="Ta bort">
                            <i class="fas fa-trash-alt text-xs"></i>
                        </button>
                    </div>
                `;
                
                cols[game.status].appendChild(card);
            });

            const totalGames = games.length;
            const completedCount = counts.completed;
            const completionRate = totalGames > 0 ? Math.round((completedCount / totalGames) * 100) : 0;

            document.getElementById('stat-backlog').innerText = counts.backlog;
            document.getElementById('stat-time').innerText = Math.round(totalRemainingTime);
            document.getElementById('stat-completion').innerText = completionRate;

            document.getElementById('count-backlog').innerText = counts.backlog;
            document.getElementById('count-playing').innerText = counts.playing;
            document.getElementById('count-completed').innerText = counts.completed;
        }

        renderBoard();
    </script>
</body>
</html>
